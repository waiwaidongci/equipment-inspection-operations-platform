services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspection
      POSTGRES_USER: inspection
      POSTGRES_PASSWORD: inspection
    ports:
      - "5432:5432"
    volumes:
      - inspection_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspection"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      POSTGRES_DSN: postgres://inspection:inspection@postgres:5432/inspection?sslmode=disable
      JWT_SECRET: production-secret-change-me
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "5173:80"

volumes:
  inspection_pgdata:
